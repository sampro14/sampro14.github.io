<style>
:root{
  color-scheme:light;
  --bg:#f7f8fb;
  --acc:#2450ff;
  --acc-soft:rgba(36,80,255,.12);
  --ink:#0c0e14;
  --mute:#5a6070;
  --glass:rgba(255,255,255,.72);
  --border:rgba(12,14,20,.08);
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;overflow:hidden;
  background:radial-gradient(circle at 50% 42%, #ffffff 0%, #f3f5fa 68%, #eaeef7 100%);
  font-family:Sora,system-ui,sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

/* Top Glass Header */
.top{
  position:fixed;top:16px;left:max(3vw,16px);right:max(3vw,16px);
  display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;
  padding:10px 20px;
  background:var(--glass);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:999px;
  box-shadow:0 8px 30px rgba(12,14,20,.04);
  pointer-events:none;z-index:3;
  transition:transform .4s cubic-bezier(.16,1,.3,1), opacity .4s ease;
}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand-dot{
  width:9px;height:9px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 0 4px var(--acc-soft);
  animation:pulse 2.6s infinite ease-in-out;
}
@keyframes pulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 4px rgba(36,80,255,.14)}
  50%{transform:scale(1.18);box-shadow:0 0 0 7px rgba(36,80,255,.04)}
}
.top b{font-weight:800;font-size:17px;letter-spacing:-.02em}
.top nav{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;font-weight:600}
.top a{
  color:var(--ink);text-decoration:none;min-height:34px;
  display:inline-flex;align-items:center;position:relative;
  transition:color .2s ease;
}
.top a::after{
  content:"";position:absolute;left:0;right:0;bottom:5px;height:2px;
  background:var(--acc);border-radius:2px;
  transform:scaleX(0);transform-origin:right;
  transition:transform .28s cubic-bezier(.16,1,.3,1);
}
.top a:hover{color:var(--acc)}
.top a:hover::after{transform:scaleX(1);transform-origin:left}

/* Bottom Interactive Dock */
.bot{
  position:fixed;left:max(3vw,16px);right:max(3vw,16px);bottom:18px;
  display:flex;align-items:center;gap:16px;
  padding:10px 18px;
  background:var(--glass);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:999px;
  box-shadow:0 10px 32px rgba(12,14,20,.05);
  z-index:3;font-size:12.5px;font-weight:600;color:var(--mute);
}
#where{color:var(--ink);font-weight:700;min-width:165px}
.dots{display:flex;align-items:center;gap:6px;flex:1;justify-content:center}
.dot-btn{
  width:22px;height:22px;padding:0;border:none;background:transparent;
  cursor:pointer;display:grid;place-items:center;position:relative;
}
.dot-btn span{
  width:7px;height:7px;border-radius:99px;background:#cbd0dc;
  transition:all .32s cubic-bezier(.16,1,.3,1);
}
.dot-btn:hover span{background:#7d869c;transform:scale(1.35)}
.dot-btn.active span{width:24px;background:var(--acc);box-shadow:0 0 10px rgba(36,80,255,.4)}
.dot-btn::before{
  content:attr(data-label);
  position:absolute;bottom:30px;left:50%;transform:translateX(-50%) translateY(4px);
  background:var(--ink);color:#fff;font-size:11px;font-weight:600;
  padding:4px 9px;border-radius:6px;white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
}
.dot-btn:hover::before{opacity:1;transform:translateX(-50%) translateY(0)}
.bar{display:none}
.bot span.hint{white-space:nowrap;font-weight:500;opacity:.85}

.top a:focus-visible,.dot-btn:focus-visible,#gl:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media(max-width:760px){
  .bot .hint{display:none}
  .dots{display:none}
  .bar{display:block;flex:1;height:4px;background:#e4e7f0;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:4px;transition:width .1s linear}
}
@media(max-width:560px){
  .top{border-radius:20px;padding:10px 14px}
  .top nav{gap:2px 12px;font-size:12.5px}
  #where{min-width:auto;font-size:12px}
}
</style>

  var pad=new THREE.Mesh(new THREE.RingGeometry(.55,.62,36),new THREE.MeshBasicMaterial({color:0x2450ff,transparent:true,opacity:.16,side:THREE.DoubleSide}));
  pad.rotation.x=-Math.PI/2;pad.position.set(0,-2.64,z);scene.add(pad);
  var bt=d.btn.map(function(q){var b=makeBtn(q[0],q[1],q[2]);scene.add(b);buttons.push(b);return b;});
  st.push({z:z,t:tm,o:o,b:bt,pad:pad});
}

/* Ambient Studio Particles */
var fl=[];for(i=0;i<95;i++){
  var m=new THREE.Mesh(i%3===0?sg:cg,[pearl,pearl,ink,acc][i%4]);
  m.scale.setScalar(.12+Math.random()*.32);
  var sd=Math.random()<.5?-1:1;
  m.position.set(sd*(8.2+Math.random()*9.5),(Math.random()-.5)*14,6-Math.random()*(SP*(N-1)+26));
  m.userData={s:Math.random()-.5,p:Math.random()*6,y:m.position.y};
  scene.add(m);fl.push(m);
}

var VW=10,VH=6;
function layout(){
 var a=innerWidth/innerHeight;ren.setSize(innerWidth,innerHeight,false);cam.aspect=a;
 var vwT=a>=1.5?0:(a>=1?10:7);cam.fov=vwT?2*Math.atan(vwT/(16*a))*180/Math.PI:45;cam.updateProjectionMatrix();
 VH=2*8*Math.tan(cam.fov*Math.PI/360);VW=VH*a;var por=a<1;
 st.forEach(function(s,i){var w=s.t.userData.w,h=s.t.userData.h,bh=s.b.length?.75:0,
  ts=por?Math.min(1,(VW*.88)/w,(VH*.46)/(h+bh)):Math.min(1,(VW*.43)/w,(VH*.78)/(h+bh));
  var sw=w*ts,sh=h*ts,left=i%2==0,tx,top,ox,oy,os;
  if(por){tx=-sw/2;top=VH/2-1.65;ox=0;oy=-VH*.2;os=Math.min(1,VW/5.2);}
  else{tx=left?-VW/2+VW*.07:VW/2-VW*.07-sw;top=(sh+bh*ts)/2;ox=left?VW*(i?.24:.2):-VW*.24;oy=0;os=Math.min(.88,VW/13.2)*(i?1:1.12);}
  s.t.scale.setScalar(ts);s.t.position.set(tx+sw/2,top-sh/2,s.z);
  var bx=tx,by=top-sh-.42*ts,rowW=por?VW*.9:sw+VW*.1;
  s.b.forEach(function(B){var bw=B.userData.w*ts;if(bx+bw>tx+rowW&&bx>tx){bx=tx;by-=.58*ts;}B.userData.baseScale=ts;B.scale.setScalar(ts);B.position.set(bx+bw/2,by,s.z);bx+=bw+.18*ts;});
  s.o.position.set(ox,oy,s.z);s.o.scale.setScalar(os);
  s.pad.position.x=ox;
 });}
addEventListener('resize',layout);layout();

var cur=0,tgt=0,idle=0,rew=false,down=null,hov=null,ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),wheelTimer=null;
function touch(){
  idle=0;rew=false;
  clearTimeout(wheelTimer);
  /* Gentle magnetic snap to nearest chapter after scrolling settles */
  wheelTimer=setTimeout(function(){
    if(!down && !reduce){
      var nearest=Math.round(tgt*(N-1))/(N-1);
      if(Math.abs(tgt-nearest)<0.038) tgt=nearest;
    }
  },260);
}
function go(v){tgt=cl(v);touch();}
addEventListener('wheel',function(e){e.preventDefault();go(tgt+e.deltaY*.00034);},{passive:false});
addEventListener('keydown',function(e){var k=e.key;
 if(k=='ArrowDown'||k=='PageDown'||k==' '||k=='ArrowRight'){e.preventDefault();go(Math.round(tgt*(N-1)+1)/(N-1));}
 if(k=='ArrowUp'||k=='PageUp'||k=='ArrowLeft'){e.preventDefault();go(Math.round(tgt*(N-1)-1)/(N-1));}
 if(k=='Home'){go(0)}if(k=='End'){go(1)}});
function pick(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,cam);
 var vis=buttons.filter(function(b){return b.material.opacity>.4;});var h=ray.intersectObjects(vis)[0];return h?h.object:null;}
cv.addEventListener('pointerdown',function(e){down={x:e.clientX,y:e.clientY,py:e.clientY};cv.setPointerCapture(e.pointerId);touch();});
cv.addEventListener('pointermove',function(e){tmx=e.clientX/innerWidth-.5;tmy=e.clientY/innerHeight-.5;
 if(down){tgt=cl(tgt+(down.py-e.clientY)*.00115);down.py=e.clientY;touch();}
 hov=pick(e);cv.style.cursor=hov?'pointer':(down?'grabbing':'grab');});
cv.addEventListener('pointerup',function(e){var moved=down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>8;down=null;touch();
 var b=pick(e);if(b&&!moved){var a=b.userData.act;if(typeof a=='string')openURL(a);else go(a/(N-1));}});

var clock=new THREE.Clock(),prev=0,pg=document.getElementById('pg'),where=document.getElementById('where'),lastK=-1;
function frame(){
 var t=clock.getElapsedTime(),dt=Math.min(.05,t-prev);prev=t;idle+=dt;
 mx+=(tmx-mx)*Math.min(1,dt*8);
 my+=(tmy-my)*Math.min(1,dt*8);

 if(!reduce&&idle>7.5&&!rew){var f=cur*(N-1);tgt=cl(tgt+dt*.014*(.15+.85*Math.abs(Math.sin(Math.PI*f))));if(tgt>.999&&cur>.99){rew=true;idle=0;}}
 if(rew){if(idle>6){cur+=(0-cur)*.028;tgt=cur;if(cur<.003){cur=tgt=0;rew=false;idle=0;}}}
 else{
   var prevCur=cur;
   cur+=(tgt-cur)*(reduce?1:1-Math.exp(-dt*4.6));
   var vel=(cur-prevCur)/Math.max(dt,.001);
 }

 var z=8-cur*SP*(N-1);
 cam.position.set(Math.sin(cur*12.57)*.26+mx*.34,Math.cos(cur*9.4)*.18-my*.26,z);
 cam.lookAt(cam.position.x*.28,cam.position.y*.28,z-10);
 if(!reduce) cam.rotation.z=-mx*.025 - Math.max(-.04,Math.min(.04,(vel||0)*.08));

 keyLight.position.set(5.5,8.5,z-1);keyLight.target.position.set(0,0,z-8);keyLight.target.updateMatrixWorld();
 fill.position.set(mx*4,1.5-my*2,z-7);

 pg.style.width=(cur*100)+'%';
 var k=Math.round(cur*(N-1));
 if(k!==lastK){
   lastK=k;
   var num=(k+1<10?'0':'')+(k+1);
   where.textContent=num+' · '+DEF[k].name;
   dotEls.forEach(function(el,idx){el.classList.toggle('active',idx===k);});
 }

 ups.forEach(function(u,i){var s=st[i],d=Math.abs(cam.position.z-s.z-8);if(d<16)u(reduce?0:t,cur,ease(1-d/9));});
 st.forEach(function(s){
   var d=cam.position.z-s.z,op=cl((13.5-d)/4)*cl((d-1.5)/3.5);
   s.t.material.opacity=op;
   s.pad.material.opacity=op*.22;
   s.b.forEach(function(b){
     b.material.opacity=op;
     var isHov=(b===hov);
     b.material.map=isHov?b.userData.tH:b.userData.tN;
     var targetSc=(b.userData.baseScale||1)*(isHov?1.045:1);
     b.userData.sc+=(targetSc-b.userData.sc)*Math.min(1,dt*14);
     b.scale.setScalar(b.userData.sc);
   });
 });

 if(!reduce)fl.forEach(function(m){var d=m.userData;m.rotation.x=t*d.s+d.p;m.rotation.y=t*d.s*1.3;m.position.y=d.y+Math.sin(t*.5+d.p)*.42;});
 ren.render(scene,cam);requestAnimationFrame(frame);
}
frame();
}
})();
</script>
</body>
</html>
