<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sameer Atram · Applied AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, spatial, confident — a quiet flight through an engineer's work
   IDEA: an open, star-lit space; the camera travels forward and each chapter arrives out of the depth
   PICTURE: a glowing portrait ring in the intro; glass panels hanging in space, stars streaming past
   COLOUR and TYPE: deep ink night with pale ice light and one coral accent; Sora + Inter
   LAYOUT: one fixed stage; scenes stacked along z; nav and progress dots float on top */
:root{color-scheme:light dark;
--bg:light-dark(#e9edf4,#05070c);--bg2:light-dark(#dde3ee,#0e1320);
--ink:light-dark(#0f131b,#eef2f8);--mute:light-dark(#4b5466,#9aa5b8);
--glass:light-dark(rgba(255,255,255,.74),rgba(20,26,40,.6));--line:light-dark(rgba(15,19,27,.13),rgba(210,225,255,.15));
--acc:#ff6a3d;--ice:light-dark(#2557d6,#a9c8ff);--glow:light-dark(rgba(37,87,214,.14),rgba(120,170,255,.14))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-snap-type:y mandatory;scrollbar-width:none}html::-webkit-scrollbar{display:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
h1,h2,h3{font-family:Sora,Inter,sans-serif;line-height:1.08;text-wrap:balance;margin:0}
/* the scroll track is invisible: it only measures travel */
.track>div{height:100svh;scroll-snap-align:start}
.space{position:fixed;inset:0;overflow:hidden;perspective:1000px;perspective-origin:50% 50%;
background:radial-gradient(60% 55% at 50% 50%,var(--glow),transparent 70%),radial-gradient(35% 30% at 85% 12%,rgba(255,106,61,.10),transparent 70%)}
#stars{position:absolute;inset:0;width:100%;height:100%}
.scene{position:absolute;left:50%;top:50%;width:min(1120px,92vw);transform-style:preserve-3d;will-change:transform,opacity;visibility:hidden}
.scene{top:calc(50% + 14px)}.scene .box{max-height:calc(100svh - 190px);overflow:auto;scrollbar-width:thin}
nav{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;justify-content:space-between;padding:12px max(4vw,16px)}
nav b{font-family:Sora;font-weight:600}
nav .links{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:15px}
nav button{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;min-height:40px;padding:0}
nav button:hover,nav button.on{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;font:600 15px Inter;text-decoration:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer}
.btn.main{background:var(--acc);color:#fff;border-color:transparent}
.btn:focus-visible,a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
/* intro */
.intro{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(24px,5vw,64px);align-items:center}
.portrait{position:relative;aspect-ratio:1;width:min(100%,420px);justify-self:center}
.portrait .ring{position:absolute;inset:0;border-radius:50%;border:1px dashed var(--line);animation:spin 40s linear infinite}
.portrait .ring::after{content:"";position:absolute;top:8%;left:12%;width:14px;height:14px;border-radius:50%;background:var(--acc);box-shadow:0 0 18px var(--acc)}
.portrait .ph{position:absolute;inset:9%;border-radius:50%;overflow:hidden;display:grid;place-items:center;
background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--ice) 45%,transparent),transparent 60%),linear-gradient(160deg,var(--bg2),color-mix(in srgb,var(--acc) 30%,var(--bg2)));
border:1px solid var(--line);box-shadow:0 40px 90px -30px rgba(0,0,0,.6),0 0 0 10px color-mix(in srgb,var(--glow) 60%,transparent)}
.portrait .ph img{width:100%;height:100%;object-fit:cover}
.portrait .ph span{font:700 clamp(56px,9vw,110px) Sora;color:var(--ink);opacity:.85}
@keyframes spin{to{transform:rotate(360deg)}}
.intro .role{font-family:Sora;font-size:clamp(16px,1.8vw,20px);color:var(--ice);margin-bottom:10px}
.intro h1{font-size:clamp(40px,6vw,72px);letter-spacing:-.02em;margin-bottom:16px}
.intro p{margin:0 0 18px;color:var(--mute);font-size:clamp(16px,1.4vw,18px);max-width:58ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 22px}
.facts div{padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass)}
.facts b{display:block;font:600 15px Sora}.facts span{font-size:13px;color:var(--mute)}
.cta{display:flex;flex-wrap:wrap;gap:10px}
/* panels */
.panel{width:min(720px,100%);margin:0 auto;padding:clamp(20px,3vw,34px);border-radius:26px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.3);
box-shadow:0 40px 90px -30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16);transition:transform .25s ease-out}
.float{animation:bob 7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.when{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px;color:var(--mute);margin-bottom:10px}
.tag{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(255,106,61,.14);color:var(--acc)}
.panel h3{font-size:clamp(24px,3vw,32px);margin-bottom:6px}
.org{font-weight:500;color:var(--ice);margin:0 0 12px}
.panel ul{margin:12px 0 0;padding-left:20px}.panel li{margin:5px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0 4px}
.stat{padding:10px 12px;border-radius:14px;border:1px solid var(--line)}
.stat b{display:block;font:700 22px Sora}.stat span{font-size:13px;color:var(--mute)}
.stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.stack span{font-size:13px;padding:3px 10px;border-radius:8px;background:var(--bg2);color:var(--mute)}
.lk{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.lk a{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:12px;border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:14px}
.lk a:hover{border-color:var(--acc);color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips button{font:600 14px Inter;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chips button.on{border-color:var(--acc);color:var(--acc)}
.peek{margin-top:12px;padding:14px;border-radius:14px;background:var(--bg2);font-size:15px}
/* project wall + skills */
.sec h2{font-size:clamp(30px,4.2vw,46px);margin-bottom:6px;text-align:center}
.sec .sub{text-align:center;color:var(--mute);margin:0 auto 22px;max-width:520px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px}
.repo{position:relative;min-height:250px;border-radius:20px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);overflow:hidden;transition:transform .3s,box-shadow .3s;cursor:pointer}
.repo:hover,.repo:focus-within{transform:translateZ(0) scale(1.04);box-shadow:0 30px 60px -30px rgba(0,0,0,.6);z-index:2}
.repo .face,.repo .more{position:absolute;inset:0;padding:18px;display:flex;flex-direction:column;transition:opacity .3s,transform .35s}
.repo .more{opacity:0;transform:scale(.94);background:var(--bg2);overflow:auto}
.repo:hover .more,.repo:focus-within .more,.repo.open .more{opacity:1;transform:none}
.repo:hover .face,.repo:focus-within .face,.repo.open .face{opacity:0}
.repo h3{font-size:19px;margin:8px 0}.repo p{margin:0;color:var(--mute);font-size:14px}
.repo .lang{font-size:13px;color:var(--ice);font-weight:600}
.repo .tip{margin-top:auto;font-size:13px;color:var(--mute)}
.repo .more ul{margin:0 0 8px;padding-left:18px;font-size:14px}
.repo .more .lk{margin-top:auto}.repo .more .lk a{min-height:40px}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-bottom:26px}
.sk{padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--glass)}
.sk h3{font-size:16px;margin-bottom:4px}
.contact{text-align:center}.contact .cta{justify-content:center}
.mail{font-size:14px;color:var(--mute);margin-top:12px}
/* hud */
.dots{position:fixed;right:max(2.5vw,10px);top:50%;transform:translateY(-50%);display:grid;gap:4px;z-index:30}
.dots button{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-height:28px;border:0;background:none;color:var(--mute);font:500 13px Inter;cursor:pointer;padding:0}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mute);flex:none;transition:.2s}
.dots button.on{color:var(--ink)}.dots button.on i{background:var(--acc);border-color:var(--acc);transform:scale(1.4)}
.dots span{opacity:0;transition:.2s;white-space:nowrap}.dots:hover span,.dots button.on span{opacity:1}
.hud{position:fixed;left:0;right:0;bottom:16px;z-index:30;display:flex;justify-content:center;align-items:center;gap:14px;pointer-events:none}
.hud>*{pointer-events:auto}
.hud .where{font-size:13px;color:var(--mute);min-width:0;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.round svg{width:18px;height:18px}
.round[disabled]{opacity:.35;cursor:default}
@media(max-width:760px){.intro{grid-template-columns:1fr;text-align:center;gap:14px}.intro h1{font-size:30px;margin-bottom:10px}.intro p{font-size:15px;margin-bottom:12px}.intro .role{font-size:14px;margin-bottom:6px}.facts div{padding:8px 10px}.scene{top:calc(50% + 30px)}.scene .box{max-height:calc(100svh - 220px)}.intro p{margin-inline:auto}.intro .cta{justify-content:center}.portrait{width:min(40vw,150px)}.dots span{display:none}.dots{right:6px}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.dots{display:none}}
@media(prefers-reduced-motion:reduce){.float,.portrait .ring{animation:none}.repo,.repo .face,.repo .more,.panel{transition:none}}
</style>
</head>
<body>
<nav><b>Sameer Atram</b><div class="links" id="links"></div></nav>
<div class="space" id="space"><canvas id="stars" aria-hidden="true"></canvas><div id="scenes"></div></div>
<div class="track" id="track" aria-hidden="true"></div>
<div class="dots" id="dots"></div>
<div class="hud"><button class="round" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg></button><span class="where" id="where"></span><button class="round" id="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button></div>

<script>
{
const GH='https://github.com/sampro14/';
const P={
 lookalike:{n:'Celebrity Lookalike',lang:'Python',d:'Upload a photo and find the Bollywood celebrity you most resemble.',b:['MTCNN crops the face, VGGFace (ResNet50) embeds it','Cosine similarity against a celebrity embedding set','Streamlit front end'],s:['TensorFlow','Keras','VGGFace','MTCNN','OpenCV','Streamlit'],r:'Celebrity-lookalike'},
 fashion:{n:'Fashion Recommender',lang:'Python',d:'Upload a clothing photo and get five visually similar products.',b:['Content-based: compares images, needs no user history','ResNet50 embeddings with max pooling, L2-normalised','Nearest-neighbour search with scikit-learn'],s:['TensorFlow','ResNet50','scikit-learn','Streamlit'],r:'Fashion-recommender'},
 ldm:{n:'Text-to-Image Latent Diffusion',lang:'Python',d:'A latent diffusion pipeline with each stage trained separately.',b:['VAE with KL, VGG perceptual and adversarial losses','DistilBERT text encoder trained with a CLIP-style contrastive loss','Conditional UNet + DDPM; Flask API streams intermediate images'],s:['PyTorch','Diffusers','Transformers','Flask'],r:'Text-to-Animated-video'},
 game:{n:'Agentic Game Builder',lang:'Python',d:'Describe a game in plain English; agents clarify, plan, build, validate and repair it into a playable browser game.',b:['LangGraph state graph with clarification and repair loops','10-point static validator plus optional LLM semantic check','Repairs only the broken parts, capped at 2 rounds; live SSE streaming'],s:['LangGraph','OpenAI','FastAPI','SSE','Docker'],r:'agentic-game-builder',demo:['Watch demo','https://drive.google.com/file/d/1CUDBPYp_mgWnRbgeW4WAUWuMQs6DjtGV/view?usp=drive_link']},
 eval:{n:'AgentEval',lang:'Python',d:'Multi-agent reliability platform: finds where a run went wrong, why, and whether it recovered.',b:['Seven agents with a bounded repair loop','Ground truth from execution in a locked-down Docker sandbox','Rules-first failure attribution with LLM fallback','Fault-injection harness plants 22 known bugs to test the evaluator itself'],s:['LangGraph','FastAPI','Next.js','PostgreSQL','Redis','Docker'],r:'agentval_system'},
 memory:{n:'Engineering Memory Agent',lang:'Python',d:'Temporal, confidence-aware memory for AI agents: what is true now, what was true before, and what to distrust.',b:['Facts carry validity windows, source authority and evidence','Weak claims go to a human review queue instead of overwriting','REST API, tenant-scoped keys, async ingest queue with SKIP LOCKED'],s:['LangGraph','FastAPI','Postgres + pgvector','SQLite','Docker'],r:'enterprise_engineering_memory_agent',demo:['Live demo','https://sampro14.github.io/enterprise_engineering_memory_agent/'],st:[['95%','overall accuracy (vector RAG 82%)'],['14%','stale or poisoned answers (vector RAG 43%)']]},
 proc:{n:'Procedure Agent',lang:'Python',d:'A chat agent that follows a written procedure, with a replay-based eval gate that blocks bad releases.',b:['Legal disclosures are verbatim, never generated','Offer limits enforced in code by a PaymentPlan','Runs in the browser via Pyodide, no server'],s:['Python','DeepEval','pytest','Pyodide','GitHub Actions'],r:'procedure-agent',demo:['Live demo','https://sampro14.github.io/procedure-agent/'],st:[['9','replayed calls in the gate'],['8','planted regressions it must catch']]},
 invoice:{n:'InvoiceIQ',lang:'Python',d:'Agentic document ops: invoice PDF, scan or photo to validated, ERP-ready JSON.',b:['Two model families read independently; disagreement blocks approval','Eight deterministic checks in code (totals, tax IDs, currency, dates)','Human review via LangGraph interrupt(), survives restarts','Hash-locked 300-document held-out set and a CI gate'],s:['LangGraph','FastAPI','Gemini','Groq','SQLite'],r:'invoiceiq',st:[['8','rule checks in code'],['300','held-out test documents']]}
};
const M=[
 {y:'2024',when:'2024',tag:'Foundations',t:'Early ML builds',org:'Computer vision and generative models',txt:'Where it started: three end-to-end projects on embeddings, retrieval and diffusion. Pick one to look inside.',chips:['lookalike','fashion','ldm']},
 {y:'2025',when:'Completed 2025',tag:'Education',t:'M.Tech in CSE',org:'IIT Hyderabad',txt:'Thesis-level research in Indic multilingual NLP.',li:['Tokenization strategies for morphologically rich Indian languages','The multilingual angle that still shapes the products I build']},
 {y:'2025',when:'Jun – Dec 2025 · Hyderabad',tag:'Experience',t:'AI/ML Engineer',org:'Winfo Solutions',txt:'First production agent work, on enterprise software.',li:['Built a LangGraph four-agent suite for UI test automation','Worked across Oracle ERP modules, including HCM and Financials']},
 {y:'2026',when:'Jan 2026 – present · Hyderabad',tag:'Experience',t:'Agentic AI Developer',org:'Amgo Games',txt:'Building a prompt-to-playable platform that turns natural-language game ideas into playable Three.js experiences.',li:['Multi-agent pipeline: GDD agent → planning agent → coding agent','Hybrid RAG over the GLB 3D asset library: dense + BM25 with RRF fusion in Qdrant, metadata-enriched asset schemas, query enrichment in the planner','Retrieval measured with recall@3','Shipped ad gameplay video production that runs in minutes, and cut pipeline bottlenecks'],stack:['LangGraph','Three.js','Qdrant','RAG','Python']},
 {y:'2026',when:'Mar 2026',tag:'Open source',p:'game'},
 {y:'2026',when:'Sep 2026',tag:'Open source',p:'eval'},
 {y:'2026',when:'Sep 2026',tag:'Open source',p:'memory'},
 {y:'2026',when:'Oct 2026',tag:'Open source',p:'proc'},
 {y:'2026',when:'Nov 2026',tag:'Open source',p:'invoice'},
 {y:'Next',when:'Now',tag:'Open to work',t:'The next milestone',org:'Applied AI · FDE · Generative AI Engineer',txt:'Looking for a team that ships agents to real users and cares whether they work.',li:['Remote with US time-zone overlap','Full-time or contract'],links:[['Email me','mailto:sam14atram@gmail.com'],['LinkedIn','https://www.linkedin.com/in/sameer-atram']]}
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stats=a=>a?`<div class="stats">${a.map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('')}</div>`:'';
const stk=a=>a?`<div class="stack">${a.map(x=>`<span>${x}</span>`).join('')}</div>`:'';
const lks=p=>`<div class="lk"><a href="${GH+p.r}">Code on GitHub</a>${p.demo?`<a href="${p.demo[1]}">${p.demo[0]}</a>`:''}</div>`;
const peek=p=>`<b>${p.n}</b> · ${p.d}<ul>${p.b.map(x=>`<li>${x}</li>`).join('')}</ul>${stk(p.s)}${lks(p)}`;
const label=m=>m.p?P[m.p].n:m.t;

/* Put your photo here: a data: URI (data:image/jpeg;base64,...) or, when self-hosting, a file path like "me.jpg". Leave empty to show initials. */
const PHOTO='';
const intro=`<div class="intro">
 <div class="portrait"><div class="ring"></div><div class="ph">${PHOTO?`<img src="${PHOTO}" alt="Sameer Atram">`:'<span>SA</span>'}</div></div>
 <div><div class="role">Applied AI Engineer · Agentic AI · RAG &amp; agent memory</div>
 <h1>Hi, I'm Sameer.<br>I build agents, then prove they work.</h1>
 <p>I design multi-agent workflows with LangGraph, hybrid retrieval, guardrails and evaluation, and I test agents against real execution results and regression gates rather than demos alone. Right now I'm building a platform at Amgo Games that turns plain-English game ideas into playable Three.js games.</p>
 <div class="facts"><div><b>Amgo Games</b><span>Agentic AI Developer</span></div><div><b>IIT Hyderabad</b><span>M.Tech CSE, 2025</span></div><div><b>Hyderabad</b><span>Open to remote</span></div></div>
 <div class="cta"><button class="btn main" data-go="1">Start the journey</button><a class="btn" href="https://github.com/sampro14">GitHub</a><a class="btn" href="https://www.linkedin.com/in/sameer-atram">LinkedIn</a></div></div></div>`;
const order=['invoice','proc','memory','eval','game','ldm','fashion','lookalike'];
const wall=`<div class="sec"><h2>Projects on GitHub</h2><p class="sub">Hover or tap a card to see what it does, what it measures and where to try it.</p><div class="wall">${order.map(k=>{const p=P[k];return `<div class="repo" tabindex="0"><div class="face"><span class="lang">${p.lang}</span><h3>${p.n}</h3><p>${p.d}</p>${stats(p.st?p.st.slice(0,1):null)}<div class="tip">Hover or tap for details</div></div><div class="more"><ul>${p.b.map(x=>`<li>${x}</li>`).join('')}</ul>${stk(p.s)}${lks(p)}</div></div>`}).join('')}</div></div>`;
const SK=[['Agents & orchestration',['LangGraph','Multi-agent design','Repair loops','Human-in-the-loop']],['Retrieval & memory',['Hybrid search','BM25 + dense + RRF','Qdrant','pgvector']],['Evaluation',['Execution-based grading','DeepEval','Fault injection','CI eval gates']],['Backend & infra',['Python','FastAPI','PostgreSQL','Redis','Docker']],['ML & research',['PyTorch','TensorFlow','Diffusion','Indic NLP']]];
const contact=`<div class="sec contact"><h2>Toolkit</h2><p class="sub">What shows up across the work.</p><div class="skills">${SK.map(([h,a])=>`<div class="sk"><h3>${h}</h3>${stk(a)}</div>`).join('')}</div>
 <h2>Let's build something that works</h2><p class="sub">Open to Applied AI, Forward Deployed and Generative AI Engineer roles: remote with US time-zone overlap, full-time or contract.</p>
 <div class="cta"><a class="btn main" href="mailto:sam14atram@gmail.com">Email me</a><a class="btn" href="https://www.linkedin.com/in/sameer-atram">LinkedIn</a><a class="btn" href="https://github.com/sampro14">GitHub</a><button class="btn" data-go="0">Back to start</button></div><div class="mail">sam14atram@gmail.com</div></div>`;
const panel=(m,i)=>{let body;
 if(m.p){const p=P[m.p];body=`<h3>${p.n}</h3><p class="org">${p.d}</p>${stats(p.st)}<ul>${p.b.map(x=>`<li>${x}</li>`).join('')}</ul>${stk(p.s)}${lks(p)}`}
 else{body=`<h3>${m.t}</h3><p class="org">${m.org}</p><p style="margin:0">${m.txt}</p>${m.li?`<ul>${m.li.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}${stk(m.stack)}
 ${m.chips?`<div class="chips">${m.chips.map((c,j)=>`<button data-c="${c}" class="${j?'':'on'}">${P[c].n}</button>`).join('')}</div><div class="peek">${peek(P[m.chips[0]])}</div>`:''}
 ${m.t==='Agentic AI Developer'?`<div class="lk"><a href="${GH}agentic-game-builder">Related open-source build</a></div>`:''}
 ${m.links?`<div class="lk">${m.links.map(([a,h])=>`<a href="${h}">${a}</a>`).join('')}</div>`:''}`}
 return `<div class="float" style="animation-delay:${-i*.8}s"><div class="panel"><div class="when"><span class="tag">${m.tag}</span><span>${m.when}</span></div>${body}</div></div>`};
const S=[{k:'intro',name:'Introduction',nav:'About',html:intro},...M.map((m,i)=>({k:'m',name:label(m),nav:i===0?'Journey':'',html:panel(m,i)})),{k:'wall',name:'Projects',nav:'Projects',html:wall},{k:'end',name:'Toolkit & contact',nav:'Contact',html:contact}];
const N=S.length;
document.getElementById('scenes').innerHTML=S.map((s,i)=>`<section class="scene" data-i="${i}" aria-label="${esc(s.name)}"><div class="box">${s.html}</div></section>`).join('');
document.getElementById('track').innerHTML='<div></div>'.repeat(N);
document.getElementById('dots').innerHTML=S.map((s,i)=>`<button data-go="${i}" aria-label="Go to ${esc(s.name)}"><span>${esc(s.name)}</span><i></i></button>`).join('');
document.getElementById('links').innerHTML=S.map((s,i)=>s.nav?`<button data-go="${i}">${s.nav}</button>`:'').join('');
const scenes=[...document.querySelectorAll('.scene')],dots=[...document.querySelectorAll('.dots button')],navb=[...document.querySelectorAll('#links button')],where=document.getElementById('where'),prev=document.getElementById('prev'),next=document.getElementById('next');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
/* chips swap the preview on hover, focus or tap */
document.querySelectorAll('.chips').forEach(box=>{const pk=box.nextElementSibling;const show=b=>{box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));pk.innerHTML=peek(P[b.dataset.c])};
 box.querySelectorAll('button').forEach(b=>['mouseenter','focus','click'].forEach(ev=>b.addEventListener(ev,()=>show(b))))});
document.querySelectorAll('.repo').forEach(r=>r.addEventListener('click',e=>{if(!e.target.closest('a'))r.classList.toggle('open')}));
/* travel */
const go=i=>{i=Math.max(0,Math.min(N-1,i));scrollTo({top:i*innerHeight,behavior:reduce.matches?'auto':'smooth'})};
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go)});
let cam=0,cur=-1;const target=()=>scrollY/innerHeight;
prev.onclick=()=>go(Math.round(target())-1);next.onclick=()=>go(Math.round(target())+1);
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight'){go(Math.round(target())+1)}if(e.key==='ArrowLeft'){go(Math.round(target())-1)}});
function place(){
 scenes.forEach((el,i)=>{const t=i-cam,a=Math.abs(t);
  if(t<-.7||t>3.2){el.style.visibility='hidden';return}el.style.visibility='visible';
  if(reduce.matches){el.style.transform='translate(-50%,-50%)';el.style.opacity=Math.max(0,1-a*2);el.style.filter='none'}
  else{const z=t>0?-t*1300:-t*850;el.style.transform=`translate(-50%,-50%) translateZ(${z}px)`;el.style.opacity=Math.max(0,Math.min(1,t>0?(t<1?1-t*.85:.15-(t-1)*.07):1+t*1.9));el.style.filter=a>.08?`blur(${Math.min(a*7,10).toFixed(1)}px)`:'none'}
  el.style.pointerEvents=a<.35?'auto':'none';el.style.zIndex=String(100-Math.round(t*10))});
 const k=Math.round(cam);
 if(k!==cur){cur=k;dots.forEach((b,i)=>b.classList.toggle('on',i===k));where.textContent=`${k+1} of ${N} · ${S[k].name}`;prev.disabled=k===0;next.disabled=k===N-1;
  let act=-1;S.forEach((s,i)=>{if(s.nav&&i<=k)act=i});let n=0;S.forEach((s,i)=>{if(s.nav){navb[n].classList.toggle('on',i===act);n++}})}}
/* stars streaming toward the viewer */
const cv=document.getElementById('stars'),cx=cv.getContext('2d');let W=0,H=0,dpr=1;
const ST=Array.from({length:260},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()*N}));
const size=()=>{dpr=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)};
const starCol=()=>getComputedStyle(document.body).color;
let col=starCol(),drift=0;
function stars(){cx.clearRect(0,0,W,H);cx.fillStyle=col;
 for(const s of ST){let d=((s.z-cam-drift)%N+N)%N+.05;const sc=1/(d*.55+.12);const px=W/2+s.x*W*.5*sc,py=H/2+s.y*H*.5*sc;if(px<0||px>W||py<0||py>H)continue;
  cx.globalAlpha=Math.min(.85,.15+sc*.12);cx.beginPath();cx.arc(px,py,Math.min(2.4,.4+sc*.22),0,6.283);cx.fill()}cx.globalAlpha=1}
let lt=performance.now();
function loop(now=performance.now()){const dt=Math.min(.1,(now-lt)/1000);lt=now;const t=target();cam+=(t-cam)*(reduce.matches?1:1-Math.exp(-dt*6.5));if(Math.abs(t-cam)<.002)cam=t;if(!reduce.matches)drift+=.0006;place();stars();requestAnimationFrame(loop)}
addEventListener('resize',size);size();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{col=starCol()});new MutationObserver(()=>{col=starCol()}).observe(document.documentElement,{attributes:true});
/* gentle tilt toward the pointer on the panel in front */
document.querySelectorAll('.panel').forEach(p=>{p.addEventListener('pointermove',e=>{if(reduce.matches||e.pointerType!=='mouse')return;const r=p.getBoundingClientRect();p.style.transform=`rotateY(${((e.clientX-r.left)/r.width-.5)*7}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*7}deg)`});p.addEventListener('pointerleave',()=>{p.style.transform=''})});
requestAnimationFrame(loop);
}
</script>
</body>
</html>
